name: Keep free services awake

# Render's free plan sleeps a service after ~15 min idle (30-60s cold start, which breaks the
# first Socket.IO connect). Ping /health every 10 min. URLs are hardcoded to the deployed
# services so this works with no repo variables.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          for u in \
            https://dreamdot-chat.onrender.com \
            https://dreamdot-notifications.onrender.com
          do
            code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' "$u/health" || echo 000)
            echo "$u/health -> $code"
          done
      - name: Ping web
        run: |
          code=$(curl -s -o /dev/null -m 60 -w '%{http_code}' https://dreamdot-web.vercel.app/ || echo 000)
          echo "web -> $code"
