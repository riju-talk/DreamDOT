name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Prisma `generate` only needs a parseable schema, not a live database.
# The Next.js build renders everything dynamically, so dummy URLs are enough.
env:
  JWT_SECRET: ci-dummy-secret
  NEXTAUTH_SECRET: ci-dummy-secret
  SERVICE_SECRET: ci-dummy-secret
  MONGODB_URI: mongodb://localhost:27017/dreamdot
  POSTGRESS_DB_USER: postgresql://postgres:postgres@localhost:5432/dreamdot?schema=user_d
  POSTGRESS_DB_SOCIAL: postgresql://postgres:postgres@localhost:5432/dreamdot?schema=social
  POSTGRESS_DB_ITEMS: postgresql://postgres:postgres@localhost:5432/dreamdot?schema=items_d
  POSTGRESS_DB_COMMUNITY: postgresql://postgres:postgres@localhost:5432/dreamdot?schema=community
  POSTGRESS_DB_AUDIT: postgresql://postgres:postgres@localhost:5432/dreamdot?schema=audit

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma clients
        run: npm run prisma:generate --workspace=dreamdot

      - name: Build shared packages
        run: npm run build --workspace=@repo/database-mongo

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Type-check
        run: npm run check-types
        continue-on-error: true

      - name: Build (all workspaces)
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [chat, notifications, web3]
    steps:
      - uses: actions/checkout@v4
      - name: Build ${{ matrix.service }} image
        run: docker build -f apps/${{ matrix.service }}/Dockerfile -t dreamdot-${{ matrix.service }}:ci .
