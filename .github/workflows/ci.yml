name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install Dependencies
      run: npm ci

    - name: Generate Prisma Types
      run: npm run postinstall
      continue-on-error: true
      
    - name: Lint Code
      run: npm run lint
      
    - name: Build application
      run: npm run build
